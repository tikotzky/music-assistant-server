name: 24six Release

# Releases the 24six fork: the stable branch is upstream stable rebased with the 24six
# provider on top. Upstream's release workflow needs the Music Assistant GitHub App and its
# private secrets repository, so the fork ships with this self-contained workflow instead.
# Versions are the upstream release plus a 24six counter, e.g. 2.10.1-24six.1
# (see scripts/release_24six.py).

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version such as 2.10.1-24six.2. Leave empty to use the next 24six number
          for the upstream release this branch is rebased on.
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-24six
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: music-assistant/server
  UPSTREAM_TAG_NAMESPACE: refs/upstream-tags
  ADDON_REPOSITORY: ${{ github.repository_owner }}/music-assistant-home-assistant-addon
  ADDON_FOLDER: music_assistant
  IMAGE: ghcr.io/${{ github.repository_owner }}/server

jobs:
  release:
    name: Build, publish and update the add-on
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Fetch upstream release tags
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch --quiet upstream "+refs/tags/*:$UPSTREAM_TAG_NAMESPACE/*"

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release_24six.py resolve-version \
            --requested "$REQUESTED_VERSION" \
            --upstream-tag-namespace "$UPSTREAM_TAG_NAMESPACE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve base image version
        id: base_image
        run: |
          python3 scripts/release_24six.py base-image-version \
            --release-workflow .github/workflows/release.yml \
            --github-output "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release_24six.py release-notes \
            --version "$VERSION" \
            --image "$IMAGE" \
            --upstream-repository "$UPSTREAM_REPOSITORY" \
            --upstream-tag-namespace "$UPSTREAM_TAG_NAMESPACE" \
            --output "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Install build dependencies
        run: python3 -m pip install build tomli-w

      - name: Set package version
        shell: python
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          import os
          import tomllib

          import tomli_w

          with open("pyproject.toml", "rb") as file_handle:
              pyproject = tomllib.load(file_handle)
          pyproject["project"]["version"] = os.environ["PACKAGE_VERSION"]
          with open("pyproject.toml", "wb") as file_handle:
              tomli_w.dump(pyproject, file_handle)

      - name: Build wheel and source distribution
        run: python3 -m build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          push: true
          build-args: |
            MASS_VERSION=${{ steps.version.outputs.package_version }}
            BASE_IMAGE_VERSION=${{ steps.base_image.outputs.base_image_version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.hass.version=${{ steps.version.outputs.version }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA"

      - name: Check out add-on repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.ADDON_REPOSITORY }}
          token: ${{ secrets.PRIVILEGED_GITHUB_TOKEN }}
          path: addon-repo
          fetch-depth: 0

      - name: Update add-on release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release_workflow.py update-addon \
            --config "addon-repo/$ADDON_FOLDER/config.yaml" \
            --changelog "addon-repo/$ADDON_FOLDER/CHANGELOG.md" \
            --version "$VERSION" \
            --release-date "$(date --utc +%d.%m.%Y)" \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --retain 3

      - name: Commit add-on update
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd addon-repo
          branch=$(git rev-parse --abbrev-ref HEAD)
          git add "$ADDON_FOLDER/config.yaml" "$ADDON_FOLDER/CHANGELOG.md"
          if git diff --cached --quiet; then
            echo "Add-on already references $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump the 24six add-on to $VERSION"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push the add-on update after three attempts" >&2
              exit 1
            fi
            sleep 5
          done
